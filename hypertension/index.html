<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Client Preview</title>
<style>
:root{--ground:#0f1720;--card:#18222d;--well:#0a1016;--line:#2a3845;--ink:#fff;--muted:#9aa7b2;--accent:#2f7fd1;--err:#f2836a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.card{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:32px 28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.sub{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:12.5px;color:var(--muted)}
input{width:100%;background:var(--well);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:16px;padding:13px 15px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{border:0;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:13px 20px;cursor:pointer}
button[disabled]{opacity:.55;cursor:progress}
button:focus-visible{outline:2px solid #9cc7f0;outline-offset:2px}
.msg{font-size:13px;min-height:19px;margin:0}.msg.err{color:var(--err)}.msg.busy{color:var(--muted)}
.foot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin:0}
#stage{position:fixed;inset:0;border:0;width:100%;height:100%;background:var(--ground)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate"><div class="card">
  <div><h1>Client Preview</h1><p class="sub">This preview is password protected. Enter the password you were sent to view it.</p></div>
  <form id="form" autocomplete="off">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button type="submit" id="go">View</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="foot">Shared for review only.</p>
</div></div>
<iframe id="stage" hidden title="Client Preview"></iframe>
<script>
(function(){
  "use strict";
  var KEY = "preview-unlocked:" + location.pathname;
  var form = document.getElementById("form"), pw = document.getElementById("pw"),
      go = document.getElementById("go"), msg = document.getElementById("msg"),
      gate = document.getElementById("gate"), stage = document.getElementById("stage");
  var payload = null;
  function getPayload(){
    return payload || (payload = fetch("payload.enc.json", {cache:"no-cache"}).then(function(r){
      if(!r.ok) throw new Error("payload " + r.status); return r.json();
    }));
  }
  function b64(s){ var b = atob(s), o = new Uint8Array(b.length); for(var i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }
  function show(t, c){ msg.textContent = t || ""; msg.className = "msg" + (c ? " " + c : ""); }
  async function unlock(password){
    var d = await getPayload();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(d.salt), iterations:d.iterations, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    // GCM verifies its tag: a wrong password throws here, so this is the password check.
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(d.iv)}, key, b64(d.ct));
    stage.srcdoc = new TextDecoder().decode(plain);
    stage.hidden = false; gate.hidden = true;
    try { sessionStorage.setItem(KEY, password); } catch(e){}
  }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(!pw.value) return;
    go.disabled = true; show("Decrypting…", "busy");
    setTimeout(function(){
      unlock(pw.value).catch(function(err){
        go.disabled = false;
        show(String(err && err.message).indexOf("payload") === 0
          ? "Couldn't load the preview. Refresh and try again."
          : "That password didn't work. Check it and try again.", "err");
        pw.select();
      });
    }, 30);
  });
  try { var c = sessionStorage.getItem(KEY); if(c) unlock(c).catch(function(){ try{ sessionStorage.removeItem(KEY); }catch(e){} }); } catch(e){}
  if(!(window.crypto && crypto.subtle)){ show("This browser can't open the preview. Use a current browser over https.", "err"); go.disabled = true; }
})();
</script>
</body>
</html>
